<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#fbf7f4">
  <meta name="description" content="J Beauty Spa — سبا نسائي منزلي فاخر في المدينة المنورة. اطلبي لحظتك الخاصة في راحة بيتك.">
  <title>J Beauty Spa | سبا نسائي منزلي المدينة المنورة</title>
  <link rel="icon" type="image/png" href="/assets/brand/official-logo.png">
  <link rel="preload" as="font" type="font/woff2" href="/fonts/plex-arabic-400.woff2" crossorigin>
  <link rel="preload" as="font" type="font/woff2" href="/fonts/newsreader-roman.woff2" crossorigin>
  <link rel="stylesheet" href="/shared/tokens.css?v=20261117-v5">
  <link rel="stylesheet" href="/styles.css?v=20261117-v5">
  <style>
    .jb-initial-loader {
      min-height: 80vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      color: #86585B;
      font-family: 'IBM Plex Sans Arabic', sans-serif;
      text-align: center;
      direction: rtl;
    }
    .jb-loader-lotus {
      font-size: 38px;
      animation: jbLotusPulse 1.8s ease-in-out infinite;
    }
    @keyframes jbLotusPulse {
      0%, 100% { transform: scale(1); opacity: 0.85; filter: drop-shadow(0 0 8px rgba(197, 160, 120, 0.4)); }
      50% { transform: scale(1.15); opacity: 1; filter: drop-shadow(0 0 16px rgba(197, 160, 120, 0.8)); }
    }
  </style>
</head>
<body>
  <a href="#main" class="skip">Skip to content / انتقلي للمحتوى</a>
  <div id="app">
    <div class="jb-initial-loader" aria-busy="true" aria-label="جاري تجهيز تجربة السبا...">
      <div class="jb-loader-lotus">🌸</div>
      <p>J Beauty Spa · جاري تجهيز لحظتك الخاصة</p>
    </div>
  </div>
  <div id="toast" role="status" aria-live="polite"></div>
  <div class="mobile-book-bar" id="mobile-bar" hidden>
    <a class="btn" id="mobile-book-btn" href="/ar/booking">احجزي موعدك</a>
  </div>
  <script type="module" src="/app.js?v=20261117-v5"></script>
</body>
</html>
